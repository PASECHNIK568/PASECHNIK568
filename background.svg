<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827; stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle fill="#374151" cx="2" cy="2" r="1.5"></circle>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" />
  <rect width="100%" height="100%" fill="url(#dots)" />
  <text x="40" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#f3f4f6">
    Мой крутой проект
  </text>
  <text x="40" y="130" font-family="Arial, sans-serif" font-size="20" fill="#9ca3af">
    Добро пожаловать в мой репозиторий!
  </text>
</svg>
